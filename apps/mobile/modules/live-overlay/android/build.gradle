// 'expo-module' already applies com.android.library + kotlin-android internally.
// Adding them again causes a "plugin already applied" Gradle error.
apply plugin: 'expo-module'

android {
  namespace 'expo.modules.liveoverlay'
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

// expo-modules-core is provided automatically by the expo-module plugin;
// no explicit dependency declaration needed.
