// Local Expo modules (linked via file: in package.json) are NOT published
// through npm autolinking, so the 'expo-module' convenience plugin is not
// registered in the Gradle plugin registry at evaluation time. Use the
// explicit Android + Kotlin plugins instead and declare expo-modules-core
// as a direct project dependency.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'expo.modules.liveoverlay'
  // safeExtGet() is a root-project helper that doesn't cross project
  // boundaries — use explicit values for this local module.
  compileSdkVersion 35
  defaultConfig {
    // Must be <= the host app's minSdk (24). Runtime API-26 checks in
    // OverlayManager handle the TYPE_APPLICATION_OVERLAY fallback.
    minSdkVersion 24
    targetSdkVersion 35
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
